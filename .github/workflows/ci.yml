name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vpn_test
          POSTGRES_USER: vpn_test
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn_test -d vpn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://vpn_test:test-password@localhost:5432/vpn_test?sslmode=disable
      REQUIRE_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(find ./cmd -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Resolve dependencies
        run: go mod tidy

      - name: Ensure dependency files are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

  client:
    name: Flutter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
