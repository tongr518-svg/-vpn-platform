name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vpn_test
          POSTGRES_USER: vpn_test
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn_test -d vpn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://vpn_test:test-password@localhost:5432/vpn_test?sslmode=disable
      REQUIRE_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(find ./cmd ./internal -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Resolve dependencies
        run: go mod tidy

      - name: Ensure dependency files are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Build read-only node agent
        run: go build -o "$RUNNER_TEMP/node-agent" ./cmd/node-agent

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

  client:
    name: Flutter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! dart format --output=none --set-exit-if-changed "$file" >/dev/null 2>&1; then
              echo "::error file=client/$file::Dart formatting required"
              failed=1
            fi
          done < <(find lib test -type f -name '*.dart' -print0)
          exit "$failed"

      - name: Analyze
        shell: bash
        run: |
          set +e
          output="$(flutter analyze 2>&1)"
          result=$?
          printf '%s\n' "$output"
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$output"
          fi
          exit "$result"

      - name: Test
        shell: bash
        run: |
          set +e
          output="$(flutter test --reporter expanded 2>&1)"
          result=$?
          printf '%s\n' "$output"
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$output"
          fi
          exit "$result"

  windows-build:
    name: Windows desktop build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name vpn_platform_client .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows desktop client
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-windows
          path: client/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
