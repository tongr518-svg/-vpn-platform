name: Temporary formatter capture

on:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format client source
        working-directory: client
        run: dart format lib test

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-client-source
          path: client/lib/main.dart
          retention-days: 1
